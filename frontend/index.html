<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz Harry Potter - PoC</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; }
        .quiz-container { background: white; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { background: #740001; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-top: 15px;}
        button:hover { background: #d3a625; color: black; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h2>Quiz de Harry Potter</h2>
        <form id="quizForm">
            <p>1. Qual é a casa de Hogwarts do Harry Potter?</p>
            <input type="radio" name="p1" value="Sonserina"> Sonserina<br>
            <input type="radio" name="p1" value="Grifinória"> Grifinória<br>

            <p>2. Quem é o padrinho de Harry Potter?</p>
            <input type="radio" name="p2" value="Sirius Black"> Sirius Black<br>
            <input type="radio" name="p2" value="Severo Snape"> Severo Snape<br>

            <br>
            <button type="button" onclick="enviarRespostas()">Enviar Respostas</button>
        </form>
        <h3 id="resultado"></h3>
    </div>

    <script>
        function enviarRespostas() {
            const p1 = document.querySelector('input[name="p1"]:checked');
            const p2 = document.querySelector('input[name="p2"]:checked');

            if (!p1 || !p2) {
                alert("Responda todas as perguntas!");
                return;
            }

            let pontuacao = 0;
            if (p1.value === "Grifinória") pontuacao++;
            if (p2.value === "Sirius Black") pontuacao++;

            document.getElementById('resultado').innerText = `Você acertou ${pontuacao} de 2 questões!`;
        }
    </script>
</body>
</html>
